<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>儿童学习陪伴 · 家长端</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar" id="topbar">
      <div class="brand" onclick="App.navigate('dashboard')">
        <span class="brand-logo">📖</span>
        <span class="brand-name">儿童学习陪伴</span>
      </div>
      <nav class="nav-menu" id="navMenu"></nav>
      <div class="topbar-right">
        <div class="user-area" id="userArea"></div>
      </div>
    </header>

    <main class="content" id="content"></main>

    <nav class="bottom-tabs" id="bottomTabs"></nav>

    <div class="modal-overlay" id="modalOverlay">
      <div class="modal" id="modal"></div>
    </div>

    <div class="eye-rest-overlay" id="eyeRestOverlay">
      <div class="eye-rest-box">
        <div class="eye-rest-icon">🙈</div>
        <h2>休息一下吧</h2>
        <p>看远处 1 分钟，保护眼睛</p>
        <div class="eye-rest-timer" id="eyeRestTimer">60</div>
        <div class="eye-rest-tip">远处眺望 · 闭眼休息 · 做眼保健操</div>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
